name: serro-daily-brief
description: |
  Use when: You want a single daily digest of what's happening across your work —
  today's meetings, recent Jira movement, and open decisions — pulled live from Serro.
  Triggers: "daily brief", "serro brief", "what's on today", "morning digest".
  Does: Pulls meetings + Jira activity from Serro -> synthesizes a short, skimmable
        brief -> saves it as a run artifact.
  NOT for: Deep single-topic research (ask the agent directly instead), or a
        program-scoped status report (use serro-digest-builder).

  Requires the Serro MCP server registered user-scoped:
    claude mcp add --transport http --scope user serro https://mcp.serro.ai/mcp
  Read-only: writes only into the run's artifacts directory, and posts nothing.

tags: [serro, context]
worktree:
  enabled: false
mutates_checkout: false

nodes:
  # ---------------------------------------------------------------------------
  # 1. Gather. The only node that talks to Serro. Tools come from the user-scoped
  #    `serro` server, so there is no per-repo mcp config to install and this runs
  #    unchanged from any project.
  # ---------------------------------------------------------------------------
  - id: gather
    description: Pull today's meetings and recent Jira movement from Serro
    model: medium
    denied_tools: [Edit, NotebookEdit]
    prompt: |
      Gather today's working context from Serro.

      Start by confirming Serro is reachable: list your tools and look for ones
      named `mcp__serro__*`. If there are none, or your first call fails with an
      auth error, set `serro_available` to "false", put the exact error in `notes`,
      return empty arrays, and stop. Never fill the gap with plausible-looking
      activity — a brief that invents a meeting is worse than no brief.

      Otherwise call `mcp__serro__whoami` once to establish who this run is acting
      as. The organization is whatever that identity belongs to; do not pass an
      organization id that you were not handed by the server.

      Then gather, using whichever tools actually exist in your tool list rather
      than assuming names:
        - meetings happening today
        - Jira issues updated in the last 24 hours
        - any program status worth flagging

      Where a source genuinely returns nothing, use an empty array and record that
      in `notes`, so the reader can tell "nothing happened" apart from "the lookup
      failed".
    output_format:
      type: object
      properties:
        serro_available:
          type: string
          enum: ['true', 'false']
        meetings:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              time: { type: string }
              attendees: { type: string }
        jira_updates:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              summary: { type: string }
              status: { type: string }
        program_flags:
          type: array
          items: { type: string }
        notes:
          type: string
      required: [serro_available, meetings, jira_updates, program_flags, notes]

  # ---------------------------------------------------------------------------
  # 2. Guard. Deterministic. Without it an unreachable Serro merely produces an
  #    empty brief, which reads exactly like a quiet day.
  # ---------------------------------------------------------------------------
  - id: guard
    description: Fail the run when Serro was unreachable, rather than emitting an empty brief
    depends_on: [gather]
    bash: |
      AVAILABLE=$gather.output.serro_available
      NOTES=$gather.output.notes
      if [ "$AVAILABLE" != "true" ]; then
        echo "SERRO GUARD: Serro MCP was not reachable." >&2
        echo "  Detail: $NOTES" >&2
        echo "  Fix: claude mcp add --transport http --scope user serro https://mcp.serro.ai/mcp" >&2
        echo "       claude mcp login serro" >&2
        echo "  Note: a Serro connector added in the claude.ai UI is NOT visible to headless Archon runs." >&2
        exit 1
      fi
      echo "Serro reachable."

  # ---------------------------------------------------------------------------
  # 3. Synthesize. No tool calls, so a small model is enough.
  # ---------------------------------------------------------------------------
  - id: synthesize
    description: Turn the gathered data into a skimmable brief
    depends_on: [guard]
    model: small
    allowed_tools: [Write]
    prompt: |
      Write a short, skimmable daily brief from this data. Keep it under 200 words,
      lead with anything time-sensitive, and end with a one-line "focus for today".

      Meetings: $gather.output.meetings
      Jira updates: $gather.output.jira_updates
      Program flags: $gather.output.program_flags
      Collection notes: $gather.output.notes

      If the notes record that a source came back empty, say so in one line rather
      than padding the brief.

      Save the brief to $ARTIFACTS_DIR/daily-brief.md and also print it.
